<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WarpTV</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
}

/* 🔥 BACKGROUND */
body {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #05070c;
}

/* 🌌 LOGO DE FUNDO (RESPIRANDO) */
.bg-logo {
  position: absolute;
  inset: 0;
  background: url("./splash.png") center/70% no-repeat;
  opacity: 0.10;
  filter: blur(10px);
  animation: breathe 6s ease-in-out infinite;
}

/* 🫧 ANIMAÇÃO LEVE */
@keyframes breathe {
  0%,100% { transform: scale(1.1); opacity: 0.10; }
  50% { transform: scale(1.15); opacity: 0.14; }
}

/* 🌑 ESCURECIMENTO */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(83,110,255,0.12), transparent 50%),
    rgba(0,0,0,0.65);
  z-index: 1;
}

/* 🎯 PAINEL */
.panel {
  position: relative;
  z-index: 2;
  width: 300px;
  padding: 22px;
  border-radius: 18px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  text-align: center;

  /* ✨ FADE AO ABRIR */
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.title {
  font-size: 26px;
  font-weight: 700;
}

.subtitle {
  margin-top: 6px;
  font-size: 13px;
  color: rgba(255,255,255,0.7);
}

/* 🟢 STATUS */
.status-card {
  margin-top: 18px;
  padding: 12px;
  border-radius: 14px;
  background: rgba(0,255,128,0.10);
  border: 1px solid rgba(0,255,128,0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;

  /* ✨ glow leve */
  box-shadow: 0 0 12px rgba(0,255,128,0.15);
  transition: 0.25s;
}

.status-card.offline {
  background: rgba(255,180,0,0.08);
  border-color: rgba(255,180,0,0.15);
  box-shadow: 0 0 12px rgba(255,180,0,0.15);
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #00e676;
  box-shadow: 0 0 10px rgba(0,230,118,0.9);
  animation: pulse 1.5s infinite;
}

.status-card.offline .dot {
  background: #ffb300;
  box-shadow: 0 0 10px rgba(255,179,0,0.9);
}

.status-text {
  font-size: 15px;
  font-weight: 700;
  color: #86ffb6;
}

.status-card.offline .status-text {
  color: #ffd36b;
}

@keyframes pulse {
  0%,100% { transform: scale(1); opacity: .8; }
  50% { transform: scale(1.2); opacity: 1; }
}

/* 🔘 BOTÃO */
.btn {
  margin-top: 16px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #2a7dff, #8a59ff);
  color: white;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="bg-logo"></div>

<div class="panel">
  <div class="title">WarpTV</div>
  <div class="subtitle">Rodando em segundo plano</div>

  <div class="status-card" id="statusCard">
    <div class="dot"></div>
    <span class="status-text" id="statusText">Verificando...</span>
  </div>

  <button class="btn" onclick="window.close()">Minimizar</button>
</div>

<script>
const statusText = document.getElementById("statusText");
const statusCard = document.getElementById("statusCard");

async function atualizarStatus() {
  try {
    const res = await fetch("http://127.0.0.1:3000/app-status");
    const data = await res.json();

    if (data.discordConnected) {
      statusText.textContent = "Discord conectado";
      statusCard.classList.remove("offline");
    } else {
      statusText.textContent = "Aguardando Discord";
      statusCard.classList.add("offline");
    }

  } catch {
    statusText.textContent = "Servidor offline";
    statusCard.classList.add("offline");
  }
}

atualizarStatus();
setInterval(atualizarStatus, 2000);
</script>

</body>
</html>
