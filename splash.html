<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      position: relative;
      width: 100vw;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.22);
      pointer-events: none;
    }

    /* brilho pulsando no centro */
    .glow {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .glow::before {
      content: "";
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(70,140,255,0.22) 0%, rgba(255,0,180,0.18) 35%, rgba(0,0,0,0) 70%);
      filter: blur(18px);
      animation: pulseGlow 2s ease-in-out infinite;
      transform: translateY(-10px);
    }

    /* loading bar */
    .loading-wrap {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: 70%;
      max-width: 320px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.35);
    }

    .loading-bar {
      width: 35%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #47b8ff, #b95cff, #ff4fd8);
      box-shadow: 0 0 12px rgba(120, 100, 255, 0.65);
      animation: loadingMove 1.35s ease-in-out infinite;
    }

    /* fade-out ao fechar */
    .fade-out {
      animation: fadeOut 0.45s ease forwards !important;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(1.03);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(0.985);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        opacity: 0.55;
        transform: translateY(-10px) scale(0.95);
      }
      50% {
        opacity: 1;
        transform: translateY(-10px) scale(1.08);
      }
    }

    @keyframes loadingMove {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(320%);
      }
    }
  </style>
</head>

<body>
  <div class="wrapper" id="wrapper">
    <div class="overlay"></div>
    <img id="splash">
    <div class="glow"></div>

    <div class="loading-wrap">
      <div class="loading-bar"></div>
    </div>
  </div>

  <script>
    const path = require("path");
    const { app, ipcRenderer } = require("electron");

    const img = document.getElementById("splash");
    const wrapper = document.getElementById("wrapper");

    if (app.isPackaged) {
      img.src = path.join(process.resourcesPath, "splash.png");
    } else {
      img.src = path.join(__dirname, "splash.png");
    }

    // recebe sinal do main para fechar com fade
    ipcRenderer.on("splash-fade-out", () => {
      wrapper.classList.add("fade-out");
    });
  </script>
</body>
</html>
